<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a trip — Outfits</title>
  <meta name="description" content="Open this invite in Outfits, or enter the code after installing.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://outfitstravel.app/join/">

  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Outfits">
  <meta property="og:title" content="Join a trip — Outfits">
  <meta property="og:description" content="Open this invite in Outfits, or enter the code after installing.">
  <meta property="og:url" content="https://outfitstravel.app/join/">

  <link rel="stylesheet" href="/styles.css">
  <script src="/script.js" defer></script>
  <script src="/join/join.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/" aria-label="Outfits home">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 7a3 3 0 1 1 3-3"/>
          <path d="M16 7 4.5 15.5A2.4 2.4 0 0 0 6 20h20a2.4 2.4 0 0 0 1.5-4.5L16 7z"/>
          <path d="M10 26h12"/>
        </svg>
        Outfits
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/#features">Features</a>
        <a href="/support/">Support</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <div class="stage container">
      <div class="card stage__card fade-up">
        <h1>Join a shared trip</h1>
        <p class="lede">
          Open in Outfits if you already have the app. New here? Install Outfits,
          then enter this code under <strong>Join a trip</strong>.
        </p>
        <p class="invite-token" data-join-code-wrap hidden>
          <span>Code:</span>
          <strong data-join-code aria-live="polite"></strong>
        </p>
        <div class="invite-actions">
          <a class="btn btn--primary" data-open-app href="outfits://join">Open in Outfits</a>
          <a class="btn btn--primary btn--store" href="https://apps.apple.com/us/app/outfits-travel-clothing-plans/id6467569577">
            Download on the App Store
          </a>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; <span data-year>2026</span> Outfits. All rights reserved.</p>
      <nav aria-label="Footer">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/support/">Support</a>
      </nav>
    </div>
  </footer>
</body>
</html>
