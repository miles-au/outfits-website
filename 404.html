<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Outfits</title>
  <meta name="description" content="This page doesn't exist. Head back to the Outfits homepage.">
  <meta name="robots" content="noindex">

  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="stylesheet" href="/styles.css">
  <script src="/script.js" defer></script>
  <!-- GitHub Pages has no path rewrite: /join/{code} lands here → query form. -->
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      if (parts.length >= 2 && parts[0] === "join") {
        var code = parts[1].trim().toUpperCase();
        if (code) {
          location.replace("/join/?code=" + encodeURIComponent(code));
        }
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/" aria-label="Outfits home">
        <img src="/favicon.svg" width="28" height="28" alt="">
        Outfits
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/#features">Features</a>
        <a href="/support/">Support</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="stage container">
      <p class="error-code fade-up" aria-hidden="true">404</p>
      <h1 class="fade-up">This page took a different trip.</h1>
      <p class="lede fade-up fade-up--late">
        The page you're looking for doesn't exist or has moved.
        Let's get you back on the itinerary.
      </p>
      <p class="fade-up fade-up--late">
        <a class="btn btn--primary" href="/">Back to home</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; <span data-year>2026</span> Outfits. All rights reserved.</p>
      <nav aria-label="Footer">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/support/">Support</a>
      </nav>
    </div>
  </footer>
</body>
</html>
